id: nav-complexity-genai-in-software-engineering

title: "Att hantera komplexiteten vid införandet av generativ AI inom mjukvaruutveckling"

year: 2024

download_url: "https://zenodo.org/records/8124332"

description: 'Detta dataset sammanställdes 2024 som en del av en akademisk studie och presenterades som ett reproduktionspaket (Replication Package) under forskningens dataanalysfas. Data från 100 mjukvaruingenjörer och 183 mjukvaruprofessionella användes för att utveckla och validera **ramverket för samarbete och anpassning mellan människa och AI (HACAF)**. Studien undersöker individuella, tekniska och sociala faktorer som påverkar införandet av generativ AI inom programvaruutveckling.'

