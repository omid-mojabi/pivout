id: nav-complexity-genai-in-software-engineering

title: "Replication Package: Navigating the Complexity of Generative AI Adoption in Software Engineering"

year: 2024

download_url: "https://zenodo.org/records/8124332"

description: 'This dataset was prepared in 2024 as part of an academic study and titled as a Replication Package in data analysis stage of the research. Data from 100 software engineers and 183 software professionals was used to develop and validate the **Human–AI Collaboration and Adaptation Framework (HACAF)**, examining individual, technological, and social factors influencing Generative AI adoption in software engineering.'

