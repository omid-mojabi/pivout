id: nav-complexity-genai-in-software-engineering

title: "پیچیدگی پذیرش هوش مصنوعی مولد در مهندسی نرم‌افزار"

year: ۲۰۲۴

download_url: "https://zenodo.org/records/8124332"

description: 'این مجموعه‌داده در سال ۲۰۲۴ به‌عنوان بخشی از یک مطالعه دانشگاهی تهیه و در مرحله تحلیل داده‌های پژوهش، با عنوان بسته بازتولیدپذیری (Replication Package) ارائه شد. داده‌های حاصل از ۱۰۰ مهندس نرم‌افزار و ۱۸۳ متخصص نرم‌افزار برای توسعه و اعتبارسنجی **چارچوب همکاری و سازگاری انسان و هوش مصنوعی (HACAF)** استفاده شدند. این پژوهش عوامل فردی، فناورانه و اجتماعی مؤثر بر پذیرش هوش مصنوعی مولد در مهندسی نرم‌افزار را بررسی می‌کند.'

