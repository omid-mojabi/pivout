id: sustainability-software-engineering

title: "Sustainability in Software Engineering"

description: 'A dataset for research on sustainability in software engineering between 2018 and 2026. The dataset was compiled from six reputable academic databases: **IEEE Xplore, Scopus, ScienceDirect, Web of Science, Springer, and ACM**. Tools such as **Zotero** and **Rayyan.ai** were used to organize, screen, evaluate, and select the relevant studies.'

