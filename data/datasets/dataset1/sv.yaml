id: sustainability-software-engineering

title: "Hållbarhet inom programvaruutveckling"

description: 'Detta dataset har tagits fram för forskning om hållbarhet inom programvaruutveckling under perioden 2018–2026. Datasetet har sammanställts från sex välrenommerade vetenskapliga databaser: **IEEE Xplore, Scopus, ScienceDirect, Web of Science, Springer och ACM**. Verktyg som **Zotero** och **Rayyan.ai** har använts för att organisera, granska, utvärdera och välja ut relevanta studier.'

