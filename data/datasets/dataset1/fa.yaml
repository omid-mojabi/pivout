id: sustainability-software-engineering

title: "مفاهیم حوزه پایداری در مهندسی نرم‌افزار"

description: 'این مجموعه‌داده برای پژوهش درباره پایداری در مهندسی نرم‌افزار در بازه زمانی ۲۰۱۸ تا ۲۰۲۶ تهیه شده است. این مجموعه‌داده از شش پایگاه علمی معتبر شامل **IEEE Xplore، Scopus، ScienceDirect، Web of Science، Springer و ACM** گردآوری شده است. ابزارهایی مانند **Zotero** و **Rayyan.ai** برای سازمان‌دهی، غربالگری، ارزیابی و انتخاب پژوهش‌های مرتبط مورد استفاده قرار گرفته‌اند.'

